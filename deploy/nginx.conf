server {
    listen 80;
    listen [::]:80;
    server_name hh-bot.157.228.121.153.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/resume-bot-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hh-bot.157.228.121.153.sslip.io;
    ssl_certificate /etc/letsencrypt/live/hh-bot.157.228.121.153.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hh-bot.157.228.121.153.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "HH Bot";
    auth_basic_user_file /etc/nginx/resume-bot.htpasswd;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
